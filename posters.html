<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Posters | Songning Zhu</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f7fa;
      color: #222;
    }

    header {
      background-color: #002b45;
      color: white;
      padding: 2rem 1rem;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }

    .header-content {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .logo {
      height: 80px;
      border-radius: 50%;
    }

    nav {
      background-color: #e8edf3;
      padding: 0.75rem;
      text-align: center;
    }

    nav a {
      margin: 0 1.2rem;
      text-decoration: none;
      color: #00334e;
      font-weight: 500;
    }

    nav a:hover {
      text-decoration: underline;
    }

    main {
      max-width: 1000px;
      margin: 3rem auto;
      padding: 0 2rem;
    }

    .poster-gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      justify-content: center;
    }

    .poster-card {
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.1);
      width: 250px;
      text-align: center;
      padding: 1rem;
    }

    .poster-card img {
      width: 100%;
      border-radius: 6px;
    }

    .poster-card h3 {
      font-size: 1rem;
      margin: 0.5rem 0;
    }

    .poster-card a {
      color: #006699;
      text-decoration: none;
      font-weight: 500;
    }

    footer {
      background-color: #002b45;
      color: #cce6ff;
      text-align: center;
      padding: 2rem 1rem;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <header>
    <div class="header-content">
      <h1>Songning Zhu, Ph.D. Candidate</h1>
      <p>Hyperspectral Imaging | Machine Learning | Cell Biology</p>
    </div>
    <img src="assets/logo_high_quality.png" alt="Logo" class="logo" />
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="posters.html">Posters</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="resume.html">Resume</a>
  </nav>

  <main>
    <h2>Poster Gallery</h2>
    <div class="poster-gallery">
      <div class="poster-card">
        <img src="assets/2022_BPS.png" alt="2022 BPS Poster" />
        <h3>2022 Biophysical Society</h3>
        <a href="assets/2022_BPS.pdf" target="_blank">View Poster</a>
      </div>
      <div class="poster-card">
        <img src="assets/ccbs_thumb.png" alt="CCBS Poster" />
        <h3>CCBS Research Symposium</h3>
        <a href="assets/ccbs_thumb.pdf" target="_blank">View Poster</a>
      </div>
      <div class="poster-card">
        <img src="assets/poster1_thumb.png" alt="Generic Poster" />
        <h3>Other Project Poster</h3>
        <a href="assets/poster1_thumb.pdf" target="_blank">View Poster</a>
      </div>
    </div>
  </main>

  <footer>
    &copy; 2025 Songning Zhu
  </footer>
</body>

</html>
