<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Posters | Songning Zhu</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f7fa;
      color: #222;
    }

    header {
      background-color: white;
      color: #111;
      text-align: center;
      padding: 1.5rem 1rem 1rem;
      border-bottom: 1px solid #ddd;
    }

    .header-inner {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .header-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .header-text h1 {
      margin: 0;
      font-size: 2.2rem;
      font-weight: 600;
      font-family: 'Times New Roman', Times, serif;
    }

    .header-text p {
      margin-top: 0.5rem;
      font-size: 1rem;
      color: #666;
      font-style: italic;
    }

    .logo {
      height: 80px;
      border-radius: 50%;
    }

    nav {
      background-color: white;
      padding: 1rem;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    nav a {
      margin: 0 1.2rem;
      text-decoration: none;
      color: #111;
      font-family: 'Times New Roman', Times, serif;
      font-size: 1rem;
    }

    nav a:hover {
      text-decoration: underline;
    }

    main {
      max-width: 1000px;
      margin: 3rem auto;
      padding: 0 2rem;
    }

    .poster-gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      justify-content: center;
    }

    .poster-card {
      width: 250px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.1);
    }

    .poster-image {
      position: relative;
    }

    .poster-image img {
      width: 100%;
      display: block;
      transition: filter 0.3s ease;
    }

    .poster-card:hover img {
      filter: brightness(65%);
    }

    .poster-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.6);
      color: white;
      font-size: 1rem;
      padding: 0.6rem 1rem;
      border-radius: 6px;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      text-align: center;
    }

    .poster-card:hover .poster-overlay {
      opacity: 1;
    }

    footer {
      background-color: white;
      color: #111;
      font-family: 'Times New Roman', Times, serif;
      text-align: center;
      padding: 1.5rem 1rem;
      font-size: 0.9rem;
      border-top: 1px solid #ddd;
    }
  </style>
</head>

<body>
  <header>
    <div class="header-inner">
      <div class="header-text">
        <h1>Songning Zhu, Ph.D. Candidate</h1>
        <p>Hyperspectral Imaging | Machine Learning | Cell Biology</p>
      </div>
      <img src="assets/logo_high_quality.png" alt="Logo" class="logo" />
    </div>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="posters.html">Posters</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="resume.html">Resume</a>
  </nav>

  <main>
    <h2>Poster Gallery</h2>
    <div class="poster-gallery">
      <div class="poster-card">
        <a href="assets/2022_BPS.pdf" target="_blank">
          <div class="poster-image">
            <img src="assets/2022_BPS.png" alt="2022 BPS Poster" />
            <div class="poster-overlay">2022 Biophysical Society</div>
          </div>
        </a>
      </div>
      <div class="poster-card">
        <a href="assets/ccbs_thumb.pdf" target="_blank">
          <div class="poster-image">
            <img src="assets/ccbs_thumb.png" alt="CCBS Poster" />
            <div class="poster-overlay">CCBS Research Symposium</div>
          </div>
        </a>
      </div>
      <div class="poster-card">
        <a href="assets/poster1_thumb.pdf" target="_blank">
          <div class="poster-image">
            <img src="assets/poster1_thumb.png" alt="Generic Poster" />
            <div class="poster-overlay">Other Project Poster</div>
          </div>
        </a>
      </div>
    </div>
  </main>

  <footer>
    &copy; 2025 Songning Zhu
  </footer>
</body>

</html>
