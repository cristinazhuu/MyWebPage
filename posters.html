<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Posters | Songning Zhu</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: black;
      color: white;
      font-family: 'Times New Roman', Times, serif;
    }

    header {
      background-color: black;
      color: white;
      text-align: center;
      padding: 2rem 1rem 1rem;
      border-bottom: 1px solid white;
    }

    header h1 {
      margin: 0;
      font-size: 2.5rem;
    }

    header p {
      font-style: italic;
      margin-top: 0.5rem;
      font-size: 1.1rem;
    }

    nav {
      background-color: black;
      text-align: center;
      padding: 1rem 0;
      border-bottom: 1px solid white;
    }

    nav a {
      margin: 0 2rem;
      color: white;
      text-decoration: none;
      font-size: 1rem;
    }

    nav a:hover {
      text-decoration: underline;
    }

    main {
      max-width: 1100px;
      margin: 3rem auto;
      padding: 0 1rem;
    }

    h2 {
      text-align: center;
      margin-bottom: 2rem;
    }

    .poster-gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      justify-content: center;
    }

    .poster-card {
      position: relative;
      width: 280px;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.2);
      transition: transform 0.3s;
    }

    .poster-card:hover {
      transform: scale(1.05);
    }

    .poster-card img {
      width: 100%;
      height: auto;
      display: block;
    }

    .poster-title {
      position: absolute;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      width: 100%;
      text-align: center;
      padding: 0.6rem 0;
      font-size: 1rem;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .poster-card:hover .poster-title {
      opacity: 1;
    }

    footer {
      background-color: black;
      color: #ccc;
      text-align: center;
      padding: 2rem 1rem;
      font-size: 0.9rem;
      border-top: 1px solid white;
    }
  </style>
</head>

<body>

  <header>
    <h1>Songning Zhu, Ph.D. Candidate</h1>
    <p>Hyperspectral Imaging | Machine Learning | Cell Biology</p>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="posters.html">Posters</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="resume.html">Resume</a>
  </nav>

  <main>
    <h2>Poster Gallery</h2>
    <div class="poster-gallery">
      <a href="assets/2022_BPS.pdf" target="_blank" class="poster-card">
        <img src="assets/2022_BPS.png" alt="2022 BPS Poster" />
        <div class="poster-title">2022 Biophysical Society</div>
      </a>
      
      <a href="assets/2025CCBS.pdf" target="_blank" class="poster-card">
        <img src="assets/ccbs_thumb.png" alt="CCBS Poster" />
        <div class="poster-title">2025 CCBS Research Symposium</div>
      </a>
      
      <a href="assets/poster1.pdf" target="_blank" class="poster-card">
        <img src="assets/poster1_thumb.png" alt="Other Poster" />
        <div class="poster-title">Organelle Dynamics Project</div>
      </a>
      
      <a href="assets/2023_BPS.pdf" target="_blank" class="poster-card">
        <img src="assets/2023_BPS_thumb.png" alt="Other Poster" />
        <div class="poster-title">Bovine Embryo Classification and Grading</div>
      </a>
      
    </div>
  </main>

  <footer>
    &copy; 2025 Songning Zhu
  </footer>

</body>

</html>
