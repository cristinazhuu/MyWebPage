<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Posters | Songning Zhu</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    header {
      background-color: #000;
      color: white;
      padding: 2rem 1rem 1rem;
      border-bottom: 1px solid #444;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .header-text {
      text-align: left;
    }

    .header-text h1 {
      font-size: 2.5rem;
      margin: 0;
    }

    .header-text p {
      font-style: italic;
      font-size: 1.1rem;
      margin-top: 0.5rem;
      color: #ccc;
    }

    .logo {
      height: 90px;
      border-radius: 50%;
    }

    nav {
      background-color: #000;
      border-top: 1px solid #444;
      border-bottom: 1px solid #444;
      text-align: center;
      padding: 1rem 0;
    }

    nav a {
      color: white;
      margin: 0 1.5rem;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 500;
    }

    nav a:hover {
      text-decoration: underline;
    }

    main {
      max-width: 1000px;
      margin: 3rem auto;
      padding: 0 2rem;
    }

    .poster-gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      justify-content: center;
    }

    .poster-card {
      position: relative;
      width: 260px;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.1);
      transition: transform 0.3s;
    }

    .poster-card:hover {
      transform: scale(1.03);
    }

    .poster-card img {
      width: 100%;
      border-radius: 10px;
      display: block;
    }

    .poster-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 1rem;
      text-align: center;
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
    }

    .poster-card:hover .poster-overlay {
      opacity: 1;
    }

    footer {
      background-color: #000;
      color: #aaa;
      text-align: center;
      padding: 2rem 1rem;
      border-top: 1px solid #444;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <header>
    <div class="header-inner">
      <div class="header-text">
        <h1>Songning Zhu, Ph.D. Candidate</h1>
        <p>Hyperspectral Imaging | Machine Learning | Cell Biology</p>
      </div>
      <img src="assets/logo_high_quality.png" alt="Logo" class="logo" />
    </div>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="posters.html">Posters</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="resume.html">Resume</a>
  </nav>

  <main>
    <h2>Poster Gallery</h2>
    <div class="poster-gallery">
      <div class="poster-card">
        <a href="assets/2022_BPS.pdf" target="_blank">
          <img src="assets/2022_BPS.png" alt="2022 BPS Poster" />
          <div class="poster-overlay">2022 Biophysical Society</div>
        </a>
      </div>
      <div class="poster-card">
        <a href="assets/ccbs_thumb.pdf" target="_blank">
          <img src="assets/ccbs_thumb.png" alt="CCBS Poster" />
          <div class="poster-overlay">CCBS Research Symposium</div>
        </a>
      </div>
      <div class="poster-card">
        <a href="assets/poster1_thumb.pdf" target="_blank">
          <img src="assets/poster1_thumb.png" alt="Generic Poster" />
          <div class="poster-overlay">Other Project Poster</div>
        </a>
      </div>
    </div>
  </main>

  <footer>
    &copy; 2025 Songning Zhu
  </footer>
</body>

</html>
